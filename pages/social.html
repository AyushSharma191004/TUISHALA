<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Great Learning Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gl-blue: #1e60d2; --text-dark: #1a1a1a; }
        body { font-family: 'Poppins', sans-serif; }

        .main-hero-section { background-color: #fff; overflow: hidden; position: relative; }

        /* Text Styles */
        .hero-title { font-size: 3rem; font-weight: 800; color: var(--text-dark); line-height: 1.2; margin-bottom: 20px; }
        .hero-desc { font-size: 1.15rem; color: #444; margin-bottom: 10px; }
        .hero-subtext { font-weight: 700; margin-bottom: 25px; }

        /* Button Fix */
        .btn-explore {
            background-color: var(--gl-blue) !important;
            color: white !important;
            padding: 14px 30px !important;
            font-weight: 600;
            border-radius: 8px;
            text-transform: uppercase;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            text-decoration: none;
        }

        /* Desktop Fix */
        @media (min-width: 992px) {
            .main-hero-section { padding: 60px 0; min-height: 600px; display: flex; align-items: center; }
            .hero-img-main { 
                max-height: 500px; 
                width: auto; 
                max-width: 100%; 
                object-fit: contain; 
                display: block; 
                margin-left: auto; 
            }
            .content-col { padding-right: 40px; }
        }

        /* Mobile Fix (Exact Great Learning Style) */
        @media (max-width: 991px) {
            .carousel-item { height: 580px; }
            .image-col { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; padding: 0 !important; }
            .hero-image-wrapper { height: 100%; position: relative; }
            .hero-img-main { width: 100%; height: 100%; object-fit: cover; }
            .hero-image-wrapper::after {
                content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 80%;
                background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.8) 80%); z-index: 2;
            }
            .content-col {
                position: absolute; bottom: 0; left: 0; width: 100%; z-index: 10;
                padding: 40px 20px !important; text-align: center;
            }
            .hero-title { color: #fff; font-size: 1.8rem; }
            .hero-desc, .hero-subtext { color: #efefef; font-size: 0.95rem; }
            .btn-explore { width: 100%; }
            .rating-box { display: none !important; }
        }
    </style>
</head>
<body>

<section class="main-hero-section">
    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-lg-6 content-col">
                            <h1 class="hero-title">11 Years of Accelerating Career Growth</h1>
                            <p class="hero-desc">Trusted by 14 million professionals worldwide.</p>
                            <p class="hero-subtext">4/5 alumni landed their dream roles*</p>
                            <a href="#" class="btn btn-explore">
                                EXPLORE PROGRAMS <i class="fas fa-arrow-right ms-2"></i>
                            </a>
                        </div>
                        <div class="col-lg-6 image-col">
                            <div class="hero-image-wrapper">
                                <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?w=600&h=400&fit=crop" class="hero-img-main">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
