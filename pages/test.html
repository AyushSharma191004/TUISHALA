<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Tools Section</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f7fb;
        }

        /* =========================
           SECTION
        ========================== */

        .tools-section {
            padding: 90px 0;
            overflow: hidden;
        }

        .section-title {
            font-size: 42px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 15px;
        }

        .section-subtitle {
            max-width: 700px;
            margin: auto;
            font-size: 16px;
            color: #6b7280;
            line-height: 1.8;
            margin-bottom: 70px;
        }

        /* =========================
           TOOL ITEM
        ========================== */

        .tool-item {
            display: flex;
            align-items: center;
            gap: 18px;

            padding: 18px 20px;

            border-radius: 18px;

            transition: all 0.3s ease;

            cursor: pointer;

            animation: fadeUp .8s ease forwards;
            opacity: 0;

            height: 100%;
        }

        .tool-item:hover {
            transform: translateY(-6px);

            background: rgba(255, 255, 255, 0.8);

            box-shadow:
                0 15px 35px rgba(59, 130, 246, 0.12);

            backdrop-filter: blur(10px);
        }

        /* =========================
           ICON CIRCLE
        ========================== */

        .tool-icon {
            width: 70px;
            height: 70px;
            min-width: 70px;

            border-radius: 50%;

            background: #ffffff;

            border: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.08);

            transition: all .3s ease;
        }

        .tool-item:hover .tool-icon {
            transform: scale(1.08);

            box-shadow:
                0 10px 25px rgba(59, 130, 246, 0.22);
        }

        /* =========================
           ICON IMAGE
        ========================== */

        .tool-icon img {
            width: 34px;
            height: 34px;

            object-fit: contain;
            display: block;
        }

        /* =========================
           TOOL TEXT
        ========================== */

        .tool-name {
            font-size: 26px;
            font-weight: 500;
            color: #111827;
            margin-bottom: 0;
            white-space: nowrap;
        }

        /* =========================
           ANIMATION
        ========================== */

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tool-box:nth-child(1) .tool-item {
            animation-delay: 0.1s;
        }

        .tool-box:nth-child(2) .tool-item {
            animation-delay: 0.2s;
        }

        .tool-box:nth-child(3) .tool-item {
            animation-delay: 0.3s;
        }

        .tool-box:nth-child(4) .tool-item {
            animation-delay: 0.4s;
        }

        .tool-box:nth-child(5) .tool-item {
            animation-delay: 0.5s;
        }

        .tool-box:nth-child(6) .tool-item {
            animation-delay: 0.6s;
        }

        .tool-box:nth-child(7) .tool-item {
            animation-delay: 0.7s;
        }

        .tool-box:nth-child(8) .tool-item {
            animation-delay: 0.8s;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media(max-width:1200px) {
            .tool-name {
                font-size: 22px;
            }
        }

        @media(max-width:992px) {

            .section-title {
                font-size: 34px;
            }

            .tool-name {
                font-size: 22px;
            }
        }

        @media(max-width:768px) {

            .tools-section {
                padding: 70px 0;
            }

            .section-title {
                font-size: 28px;
                line-height: 1.4;
            }

            .section-subtitle {
                font-size: 14px;
                margin-bottom: 50px;
            }

            .tool-item {
                justify-content: flex-start;
            }

            .tool-name {
                font-size: 20px;
            }
        }

        @media(max-width:576px) {

            .section-title {
                font-size: 24px;
            }

            .tool-item {
                padding: 16px;
            }

            .tool-icon {
                width: 65px;
                height: 65px;
                min-width: 65px;
            }

            .tool-icon img {
                width: 30px;
                height: 30px;
            }

            .tool-name {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TOOLS SECTION
    ========================== -->

    <section class="tools-section">

        <div class="container">

            <!-- Header -->

            <div class="text-center">

                <h2 class="section-title">

                </h2>

                <p class="section-subtitle">
                    Master AI tools that are currently relevant in the industry
                </p>

            </div>

            <!-- Tools Grid -->

            <div class="row g-4 justify-content-center">

                <!-- Tool 1 -->

                <div class="col-xl-3 col-lg-3 col-md-6 col-12 tool-box">

                    <div class="tool-item">

                        <div class="tool-icon">
                            <img src="#" alt="ChatGPT">
                        </div>

                        <h4 class="tool-name">ChatGPT</h4>

                    </div>

                </div>

                <!-- Tool 2 -->

                <div class="col-xl-3 col-lg-3 col-md-6 col-12 tool-box">

                    <div class="tool-item">

                        <div class="tool-icon">
                            <img src="#" alt="SQL">
                        </div>

                        <h4 class="tool-name">SQL</h4>

                    </div>

                </div>

                <!-- Tool 3 -->

                <div class="col-xl-3 col-lg-3 col-md-6 col-12 tool-box">

                    <div class="tool-item">

                        <div class="tool-icon">
                            <img src="#" alt="Hugging Face">
                        </div>

                        <h4 class="tool-name">Hugging Face</h4>

                    </div>

                </div>

                <!-- Tool 4 -->

                <div class="col-xl-3 col-lg-3 col-md-6 col-12 tool-box">

                    <div class="tool-item">

                        <div class="tool-icon">
                            <img src="#" alt="Azure AI Services">
                        </div>

                        <h4 class="tool-name">Azure AI Services</h4>

                    </div>

                </div>

                <!-- Tool 5 -->

                <div class="col-xl-3 col-lg-3 col-md-6 col-12 tool-box">

                    <div class="tool-item">

                        <div class="tool-icon">
                            <img src="#" alt="Python">
                        </div>

                        <h4 class="tool-name">Python</h4>

                    </div>

                </div>

                <!-- Tool 6 -->

                <div class="col-xl-3 col-lg-3 col-md-6 col-12 tool-box">

                    <div class="tool-item">

                        <div class="tool-icon">
                            <img src="#" alt="NumPy">
                        </div>

                        <h4 class="tool-name">NumPy</h4>

                    </div>

                </div>

                <!-- Tool 7 -->

                <div class="col-xl-3 col-lg-3 col-md-6 col-12 tool-box">

                    <div class="tool-item">

                        <div class="tool-icon">
                            <img src="#" alt="Pandas">
                        </div>

                        <h4 class="tool-name">Pandas</h4>

                    </div>

                </div>

                <!-- Tool 8 -->

                <div class="col-xl-3 col-lg-3 col-md-6 col-12 tool-box">

                    <div class="tool-item">

                        <div class="tool-icon">
                            <img src="#" alt="MidJourney">
                        </div>

                        <h4 class="tool-name">MidJourney</h4>

                    </div>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
